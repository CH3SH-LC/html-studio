<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>基础 reveal 演示</title><link rel="stylesheet" href="reveal/reveal.css"><style>.reveal{font-family:"Microsoft YaHei",sans-serif;background:#faf8f0;color:#285440}.reveal h1{font-size:56px}.reveal h2{font-size:42px}.reveal p{font-size:25px;line-height:1.8}.reveal section{padding:50px!important;box-sizing:border-box}.reveal img{width:300px;height:260px;object-fit:cover;border-radius:18px}</style></head><body><div class="reveal"><div class="slides"><section><h1>熟悉的演示，也能直接改。</h1><p>这是一份基础 reveal.js 文稿。<br>双击标题修改，然后从当前页播放。</p></section><section><h2>替换一张图片</h2><img src="assets/landscape.svg" alt="山野"><p>保存后仍可独立播放。</p></section><section><h2>保留原有动画</h2><p class="fragment">按一下方向键，出现这一行。</p><p class="fragment">再按一下，出现下一行。</p></section></div></div><script src="reveal/reveal.js"></script><script>Reveal.initialize({hash:false,width:960,height:700,margin:0.04,transition:'fade'});</script></body></html>
